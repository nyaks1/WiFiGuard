# ============================================================
# WiFiGuard Evil Twin Lab — hostapd rogue AP config
# Team Themis | ITWeb Security Summit 2026
#
# PURPOSE: Clones the SSID of the legitimate AP but presents
# a different BSSID, triggering WiFiGuard's BSSID mismatch
# detection. DNS poisoning (dnsmasq.conf) runs alongside
# this to produce a hard BLOCKED verdict.
#
# USAGE:  Started/stopped exclusively via toggle.py
#         Do NOT run hostapd directly — toggle.py handles
#         interface setup, IP assignment, and log rotation.
#
# REQUIREMENTS:
#   - WiFi adapter that supports AP mode (TP-Link TL-WN722N
#     recommended if primary adapter lacks AP capability)
#   - Check:  iw list | grep -A 10 "Supported interface modes"
#             Must show "AP" in the list
# ============================================================

# --- Interface ---
# The wireless interface to run the rogue AP on.
# Must be a DIFFERENT physical or virtual interface from the
# one your laptop uses to connect to the real network.
# Common values: wlan1, wlan0mon, wlan0_ap
interface=wlan1

# --- Network Identity ---
# ssid MUST match the legitimate AP exactly (case-sensitive).
# During the demo, update this to match the venue/test SSID.
ssid=TeamThemis_Demo

# --- Driver ---
driver=nl80211

# --- RF ---
hw_mode=g
channel=6
# channel should differ from the legitimate AP if possible —
# same channel is also valid (Evil Twins often use same channel)

# --- 802.11 feature flags ---
ieee80211n=1
wmm_enabled=1

# --- Authentication ---
# Open network — no password — mirrors a typical public banking
# WiFi hotspot. WPA2 can be added if the target AP uses it.
auth_algs=1
ignore_broadcast_ssid=0

# --- Logging ---
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
