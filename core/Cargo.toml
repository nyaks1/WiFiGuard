[package]
name = "wifiguard_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["bridge"]
bridge = ["dep:flutter_rust_bridge"]

[dependencies]
flutter_rust_bridge = { version = "2", optional = true }

[profile.release]
opt-level = "z"      # Optimize for size
lto = true
strip = true
